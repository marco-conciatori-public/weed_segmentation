# Classifier runs on plants of datasets they never trained on, next to runs that did: used by
# scripts/evaluate_unseen.py. Relative paths are resolved against the project root. See
# docs/twostage.md (Unseen sites).

# The runs, in this order (columns A, B, ...): a classifier config, for its run, or a run
# folder. Each must have its config.yaml and the checkpoint below. What each trained on is read
# from its data folder.
runs:
  - runs/classifier/cropandweed+acre+phenobench+oppd+groundbased_weed_species_min50img_min20mm_dinov3b
  - runs/classifier/cropandweed+acre+phenobench+oppd+groundbased_weed_species_min50img_min20mm_dinov3b_seed1
  - runs/classifier/cropandweed+acre+phenobench+oppd+groundbased_weed_species_min50img_min20mm_dinov3b_seed2
  - configs/classifier.yaml
  - configs/classifier_dinov3_seed1.yaml
  - configs/classifier_imageweeds.yaml
  - configs/classifier_imageweeds_seed1.yaml
# Checkpoint of each run: <run>/<checkpoint>.pt.
checkpoint: last

# Species data holding the plants to score: its classes may include species a run doesn't have.
data_dir: data/processed/public7+imageweeds/species_min50img_min20mm
# Datasets to score, and their splits. A run always scores val, so that runs can be compared on
# the same plants, and another split only if it never trained on that dataset (train is then as
# new to it as val). test stays out, for the final evaluation of the model we choose.
# train here: VCD's val has no beans from a known site other than ACRE's, and ImageWeeds's has
# only 43 redroot pigweeds. LincolnBeet's val is enough (and its train is 18,710 plants).
datasets:
  lincolnbeet: [val]
  vcd: [val, train]
  imageweeds: [val, train]
# The site of a plant, per dataset: a regular expression found in its image's `group` (see each
# dataset's doc). Without one, the sites aren't told apart (ImageWeeds doesn't give them).
# montoldre is INRAE's site, where ACRE was recorded: not a new place for a run trained on ACRE.
sites:
  lincolnbeet: "near30|bbro|walledgarden"
  vcd: "montoldre|lanxade|liposthey|bordeaux|misc"

# Roles and defer_below of the keep / remove / defer rows, as for the two-stage evaluation.
rules: configs/rules/example.yaml
eppo_taxa: configs/eppo_taxa.csv
# Share of plants the classifier is at least this sure of: the export's hand-off to the
# zero-shot model is at a species probability of 0.7 (configs/export_twostage.yaml).
sure: 0.7

# auto = CUDA when available, else CPU.
device: auto
# Lower both on a small machine. Data-loading processes also cut the crops. 0 = main process.
batch_size: 32
num_workers: 2
# Output: <output_dir>/unseen_<date>_<time>.md and .csv, crops/, and <run>/ with its
# probabilities (delete them to predict again).
output_dir: runs/unseen
