# GROUNDBASED_WEED (Moreno, Rivera and Andújar, CSIC; Data in Brief 2025): commercial tomato
# fields in Badajoz, Spain, 2021-22, boxes for tomato and 5 weed species. Used by
# scripts/download_datasets.py (see configs/download.yaml). Relative paths are resolved
# against the project root. Licence: ODbL 1.0, per the DIGITAL.CSIC record
# (https://doi.org/10.20350/digitalCSIC/17475).

# Where the download is unpacked.
raw_dir: data/raw/groundbased_weed

download:
  # Smallest first, so the readme and extra annotations are there to look at early. Sizes
  # as served on 2026-10-21; the record gives no checksums (unpacking checks each zip
  # member's CRC instead).
  files:
    - url: https://digital.csic.es/bitstream/10261/396144/9/README.txt
      size: 8450
    - url: https://digital.csic.es/bitstream/10261/396144/8/Annotations_extra.zip
      size: 1514337
      extract: true
    # The images and their Pascal VOC boxes. DIGITAL.CSIC served only the first 512 MiB of
    # its TOMATO_1.zip and TOMATO_2.zip, so they come from the authors' Nextcloud share
    # (link sent 2026-10-26), which holds the same folders unpacked: copied file by file
    # into <raw_dir>/TOMATO_n/{Annotations,Images}/. Sizes (all files of the folder) as
    # listed on 2026-10-26; the share gives no checksums.
    - share: https://saco.csic.es/s/rArggziCjyQf7kC
      path: TOMATO_2
      size: 2133847362
    - share: https://saco.csic.es/s/rArggziCjyQf7kC
      path: TOMATO_1
      size: 6183096122
  # Keep the archives in <raw_dir>/.archives/ after unpacking them.
  keep_archives: false
