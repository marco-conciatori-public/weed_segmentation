# Overlapping frames, on the plants of a split seen in several images: used by
# scripts/evaluate_overlap.py. Relative paths are resolved against the project root. See
# docs/twostage.md (Overlapping frames).

# The runs: a classifier config, for its run, or a run folder. Two seeds show the run-to-run noise.
# Each needs its two-stage evaluation and scripts/evaluate_tta.py's kept views.
runs:
  - configs/classifier.yaml
  - configs/classifier_dinov3_seed1.yaml
# <twostage_dir>/<detector run>__<run>/eval/<split>_<checkpoint>. test stays out, for the final
# evaluation of the model we choose.
split: val
checkpoint: last
twostage_dir: runs/twostage
# Its output_dir and views say where the labelled boxes' probabilities are, and which augmented
# views make the control.
tta_config: configs/evaluate_tta.yaml

# Datasets whose neighbouring frames can show one plant. Left out: PhenoBench (windows of one photo
# are the same pixels, and windows of two photos can't be paired by name or plant id), OPPD (trays
# photographed on different days), GroundBased (16 of 1,215 neighbouring pairs overlap).
datasets:
  - acre
  - cropandweed
  - vcd
  - lincolnbeet

# Placing a frame on its neighbours. Changing these registers again.
# gaps: how many frames back to look, within a session. side: longest image side used, px. features:
# most SIFT points per image. ratio: Lowe's ratio test. ransac_px: inlier distance at that side.
gaps: [1, 2, 3]
side: 1000
features: 4000
ratio: 0.75
ransac_px: 4
# Which registered pairs count. These need no new registration.
# min_inliers: points agreeing on the move. max_scale_change: largest change of scale, as a share; a
# top-down camera at one height barely has any. min_shift: how far the frame's centre must have
# moved, as a share of its longer side. It drops a robot standing still (the same picture, not a new
# view), and marks on the rig or lens matched in every frame (no move at all).
min_inliers: 15
max_scale_change: 0.2
min_shift: 0.02

# Two boxes are one plant at this IoU, inside the part both frames see. Parallax moves a tall plant
# against the ground the frames were placed on, so this isn't strict.
min_iou: 0.3
# A box this close to the frame's edge, px, counts as cut off ("whole first").
border_px: 3

# As in configs/evaluate_tta.yaml.
crops_removed: [0.01, 0.02, 0.05]
hand_off_below: 0.7
min_class_plants: 20

# The gain's interval: resampling sessions, only with at least min_sessions of them.
min_sessions: 10
interval_draws: 2000

# Processes registering frames. 0 = main process.
num_workers: 4
output_dir: runs/overlap
