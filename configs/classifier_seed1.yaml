# Classifier variant: configs/classifier_dinov2.yaml with another seed and nothing else. Its
# gaps to the base run show how much results vary by chance, so a change is judged against that
# (docs/twostage.md, Comparing runs). Trained after the base run by scripts/run_twostage.py
# (classifier_variants in configs/run_twostage.yaml).
# Result 2026-10-26/27 (last epoch): val accuracy 94.0% against the base's 93.7%, so about
# 0.3 point of chance overall, 1 point on OPPD and in the decision shares, and far more
# for a class with few val plants (ACRE's 4 maize plants swing its balanced accuracy).
base: configs/classifier_dinov2.yaml
run_name: "{dataset}_{taxonomy}_dinov2b_seed1"
seed: 1
