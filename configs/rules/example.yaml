# Example decision rules, for evaluating on CropAndWeed. NOT agronomic advice: replace the
# harmful list with the project's own, and the crops with the field's.
#
# Each recognised plant gets a role: crop or neutral -> the robot keeps it, harmful -> it
# removes it. other_plant (species the model doesn't know) is handed to the generic model.
# Keys are EPPO codes at any rank: species (ZEAMX), genus (1POAG), family (1GRAF) or order
# (1POAO); configs/eppo_taxa.csv lists the codes. The most specific matching key wins, so
# maize stays a crop inside the harmful grass family. Plants matching no key get `default`.
default: neutral
# The robot acts on a detection only when it is sure enough of two things; otherwise it hands
# the plant to the generic model too.
# 1. That it is a plant at all: minimum plant confidence (0-1). Two-stage: the detector's
#    plant score; species model: 1 - its background probability. A wrong call here mostly
#    costs a pass over bare soil (or over a plant left unlabelled). Only matters above
#    evaluate.score_threshold. null = off (every detection above that threshold counts).
plant_defer_below: 0.8
# 2. What to do with it: minimum confidence (0-1) in the action to keep or remove the plant,
#    given that it is a plant. The confidence is summed over all classes with that action, so
#    a plant that is surely one of two harmful grasses is removed even if the model can't tell
#    which. A wrong call here can cost a crop. null = off (act on the top class).
# Higher values: fewer wrong removals, more calls to the generic model. Two-stage on the
# CropAndWeed+ACRE val split (2026-10-21), with defer_below 0.9: plant_defer_below 0.7 / 0.8 /
# 0.9 removed 57% / 51% / 41% of harmful weeds and deferred 16% / 21% / 31%; crops removed
# 0% throughout.
defer_below: 0.9
rules:
  # Crops: every CropAndWeed crop, since its val and test splits mix fields of all of them.
  BEAVA: crop    # sugar beet
  GLXMA: crop    # soybean
  HELAN: crop    # sunflower
  PIBSX: crop    # pea
  SOLTU: crop    # potato
  VICFX: crop    # faba bean
  ZEAMX: crop    # maize
  # Harmful (example): strongly competitive or toxic weeds.
  1GRAF: harmful # grasses (Poaceae)
  1AMAF: harmful # goosefoots and amaranths (Amaranthaceae); sugar beet stays a crop above
  1POLF: harmful # knotweeds (Polygonaceae)
  CIRAR: harmful # creeping thistle
  CONAR: harmful # field bindweed
  DATST: harmful # thorn apple (toxic)
  # Everything else is neutral: e.g. chamomile, cornflower, corn-cockle, geranium, plantain.
