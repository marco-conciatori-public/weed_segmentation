# Classifier runs side by side: used by scripts/compare_runs.py. Relative paths are resolved
# against the project root. See docs/twostage.md (Comparing runs).

# The runs, in this order (columns A, B, ...): a classifier config, for its run, or a run
# folder, e.g. runs/classifier/cropandweed+acre+phenobench+oppd_species_min50img_min20mm_dinov2b
# for an older run.
# Three seeds of each backbone fine-tuned, then both frozen (2026-10-28; the older variants
# are in docs/twostage.md). DINOv2 is configs/classifier_dinov2.yaml since the switch to
# DINOv3 (configs/classifier.yaml).
runs:
  - configs/classifier_dinov2.yaml
  - configs/classifier_seed1.yaml
  - configs/classifier_seed2.yaml
  - configs/classifier.yaml
  - configs/classifier_dinov3_seed1.yaml
  - configs/classifier_dinov3_seed2.yaml
  - configs/classifier_frozen.yaml
  - configs/classifier_dinov3_frozen.yaml
# The evaluation compared: <run>/eval/<split>_<checkpoint> (scripts/evaluate_classifier.py),
# and the two-stage one made with the same checkpoint of each run,
# <twostage_dir>/<detector run>__<run>/eval/<split>_<checkpoint> (scripts/predict_twostage.py;
# the newest when several detectors were used).
split: val
checkpoint: last
twostage_dir: runs/twostage
# Decisions at one crop safety: for each of these shares of crops removed, per dataset, the
# share of harmful weeds removed at the lowest defer_below that removes no more crops, with
# that defer_below. At the rule file's one defer_below, a less confident run removes fewer
# crops but also fewer weeds, so those rows compare confidence as much as skill (see
# docs/twostage.md). Made again from each run's predictions and the ground truth of its
# evaluation, which must be on this machine: about 10 s per run. [] = none.
crops_removed: [0.01, 0.02, 0.05]
# Output: <output_dir>/compare_<date>_<time>.md and .csv.
output_dir: runs/compare
