# Run the steps of the two-stage pipeline one after the other, e.g. overnight on the training
# machine. Used by scripts/run_twostage.py. See docs/twostage.md.
#
# Each step keeps its own config; only the order and the config files live here. The detector
# and classifier trained are those configs/twostage.yaml names (detector.config,
# classifier.config), so the prediction step uses the checkpoints just trained.
twostage: configs/twostage.yaml
plant_dataset: configs/plant_dataset.yaml
# Everything the runner prints also goes to <log_dir>/run_twostage_<date>_<time>.log.
log_dir: runs/twostage/logs

# Steps to run, in this order; remove those you don't need. Re-running is safe: crops already
# cut for the same data are skipped, and trainings resume from their last.pt (a finished one does nothing), so
# after a failure, fix the cause and start again.
#   make_plant_dataset   plant-only copy of the species data (scripts/make_plant_dataset.py)
#   prepare_crops        crop cache for the classifier (CPU only)
#   train_detector       Mask R-CNN on the plant-only data
#   evaluate_detector    the detector alone: AP and recall of plants
#   train_classifier     DINOv2 on the crops
#   evaluate_classifier  the classifier alone, on labelled crops
#   predict_twostage     both stages on evaluate.split of configs/twostage.yaml
# Since 2026-10-26 only the classifier steps: the detector is run 2's, fixed in
# configs/twostage.yaml. The full list, for a new detector: make_plant_dataset,
# prepare_crops, train_detector, evaluate_detector, train_classifier, evaluate_classifier,
# predict_twostage.
steps:
  - prepare_crops
  - train_classifier
  - evaluate_classifier
  - predict_twostage

# Classifier variants, trained after the steps above. Each config holds only what differs
# from configs/classifier.yaml (base:) and needs its own run_name (checked before the start).
# Each variant repeats the classifier steps of the list above (prepare_crops,
# train_classifier, evaluate_classifier, predict_twostage: those listed) with its config; its
# prediction uses the detector of configs/twostage.yaml. A variant that fails with a Python
# error is reported and the next one starts. At the end, <log_dir>/compare_<date>_<time>.md
# sets all classifier runs side by side (scripts/compare_runs.py does it for any runs).
# Each variant adds about an hour. [] = none. Done on 2026-10-26: classifier_seed1.yaml,
# classifier_detail.yaml, classifier_colour.yaml (results in docs/twostage.md).
classifier_variants:
  - configs/classifier_frozen.yaml
  - configs/classifier_dinov3.yaml
  - configs/classifier_balance.yaml

# Each step runs in a process of its own. When it crashes (e.g. the GPU driver resets), the
# step is started again after restart_wait_s seconds, up to max_restarts times in all (0 = stop
# at the first crash). Trainings resume from their last checkpoint (train.checkpoint_every).
# Python errors (wrong settings, missing files) are never retried.
max_restarts: 10
restart_wait_s: 60
