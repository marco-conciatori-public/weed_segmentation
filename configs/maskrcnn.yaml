# Mask R-CNN baseline (torchvision ResNet-50 FPN v2, Apache-2.0).
# Used by scripts/train_maskrcnn.py and scripts/evaluate_maskrcnn.py, and as the base of
# configs/detector.yaml (the two-stage pipeline's plant detector: same settings, plant data).
# Relative paths are resolved against the project root. See docs/maskrcnn.md.

# Outputs (checkpoints, TensorBoard logs, metrics, evaluations) go to <output_dir>/<run_name>/.
# Placeholders: {dataset} and {taxonomy} = the last two folders of data.dir (the taxonomy
# folder name also carries the converter's settings, e.g. species_min50img_min20mm). Add your
# own text to tell apart runs that change other settings, e.g. "{dataset}_{taxonomy}_lr0.01".
# A plain name works too.
run_name: "{dataset}_{taxonomy}"
output_dir: runs/maskrcnn
seed: 0
# auto = CUDA when available, else CPU (CPU is only good for a smoke test).
device: auto

data:
  # Folder with train.json, val.json and test.json in our internal COCO format, as written by
  # the converter (<output_dir>/<taxonomy>). The categories come from the train file.
  dir: data/processed/cropandweed+acre/species_min50img_min20mm
  # Data-loading processes. 0 loads in the main process (slow, but simplest to debug).
  num_workers: 6
  # Use a random subset of N images (null = all). For a quick smoke test, e.g. 16 and 8.
  max_train_images: null
  max_val_images: null

augment:
  horizontal_flip: 0.5  # probability
  vertical_flip: 0.5
  color_jitter: {brightness: 0.2, contrast: 0.2, saturation: 0.2, hue: 0.02}

model:
  # Start from torchvision's COCO weights (~180 MB). false = random init.
  pretrained: true
  # File with those weights, for machines without internet access. Download it from
  # https://download.pytorch.org/models/maskrcnn_resnet50_fpn_v2_coco-73cbd019.pth
  # null = torchvision downloads it once to the torch cache (~/.cache/torch/hub/checkpoints).
  pretrained_path: weights/maskrcnn_resnet50_fpn_v2_coco-73cbd019.pth
  # Images are resized so the short side is min_size (one value picked at random per batch in
  # training when several are given; the last one at evaluation), long side at most max_size.
  # 1088/1920 keeps CropAndWeed at its native resolution: 10% of its plants are under 22 px.
  min_size: [1088]
  max_size: 1920
  # Anchor size per FPN level (5 levels). torchvision's default is 32-512; one level smaller
  # suits the small plants (median box ~50 px, 1% over 512 px).
  anchor_sizes: [16, 32, 64, 128, 256]
  # CropAndWeed has up to ~300 annotated regions per image.
  detections_per_image: 300
  # Detections below this score are dropped (low, so mAP sees the whole precision curve).
  score_threshold: 0.05
  mask_threshold: 0.5

train:
  epochs: 24
  batch_size: 4
  # SGD; 0.005 is torchvision's reference 0.02 for 16 images, scaled to 4.
  lr: 0.005
  momentum: 0.9
  weight_decay: 0.0001
  warmup_steps: 500
  # Max gradient norm (null = no clipping).
  grad_clip: 10.0
  # Mixed precision (CUDA only): faster and about half the memory.
  amp: true
  # Evaluate on val every N epochs (and after the last one); the best segm AP is kept.
  eval_every: 2
  eval_batch_size: 2
  # Continue from <run>/last.pt when it exists. To start over, change run_name. Resuming refuses
  # a run whose model settings or data.dir differ.
  resume: true
  # Log the training losses to TensorBoard every N steps.
  log_every: 20

evaluate:
  # Checkpoint of this run: best, last, or a path to a .pt file.
  checkpoint: best
  # Which data entry to evaluate: val or test. Keep test for the final numbers.
  split: val
  # Evaluate a random subset of N images (null = all). For a quick smoke test.
  max_images: null
  batch_size: 2
  # Confusion matrix, decisions and review: detections with at least this score, matched to
  # labelled plants at this IoU of their masks or boxes (match_by: mask or box). Box IoU
  # forgives rough outlines: on the species run, a third of the plants missed by mask IoU
  # (57% of the grasses) had a detection whose box matched. AP stays mask-based (COCO).
  score_threshold: 0.5
  iou_threshold: 0.5
  match_by: mask
  # Decision rules: which species are crops, harmful or neutral (see configs/rules/). Adds
  # decisions.csv/.json: what the robot would do (keep / remove / defer) with the plants of
  # each true role, at the confusion-matrix thresholds above. Needs species-level classes
  # (EPPO codes); null = skip, e.g. for crop/weed models.
  rules: configs/rules/example.yaml
  # EPPO taxonomy, for the rules and for taxonomic_levels.csv: of the plants found, the share
  # whose class is right at species, genus, family, order and (with rules) role level.
  eppo_taxa: configs/eppo_taxa.csv
  # Images with ground truth and predictions side by side (0 = none).
  num_previews: 20
  preview_score_threshold: 0.5

review:
  # scripts/review_errors.py: the model's worst errors on evaluate.split, as images plus a CSV
  # form for a plant expert. It reads the evaluation folder (run evaluate_maskrcnn.py first)
  # and uses the thresholds and decision rules that evaluation used. Errors shown per type.
  # Evaluation folder to review; null = this config's evaluate checkpoint and split. E.g.
  # runs/twostage/<run>/eval/val for the two-stage pipeline (scripts/predict_twostage.py).
  eval_dir: null
  per_type: 25
  # Smallest crop around a plant, in px of the original image (more context for small plants).
  min_crop_px: 400
