# Merge converted datasets into the plant detector's data: every labelled plant becomes
# `plant`, ignore regions stay ignore regions. Used by scripts/combine_datasets.py. Relative
# paths are resolved against the project root. See docs/detector.md (Datasets).

# Converted dataset folders (train.json, val.json, test.json), each converted with taxonomy
# species and the same min_plant_size_mm. The dataset name is the folder above, e.g.
# cropandweed for data/processed/cropandweed/species_min20mm.
#
# Only datasets whose every plant has a box (or an ignore region): a plant without a box is
# learned as background. Converted but left out for that reason: groundbased_weed (tomatoes
# of TOMATO_2 and plants of uncertain species not boxed), vcd (weeds not boxed), imageweeds
# (only the potted weeds boxed).
datasets:
  - data/processed/cropandweed/species_min20mm
  - data/processed/acre/species_min20mm
  - data/processed/phenobench/species_min20mm
  - data/processed/lincolnbeet/species_min20mm
  - data/processed/oppd/species_min20mm
# The combined folder's name, short: run and preview paths repeat it, and long ones pass
# Windows' 260-character limit. null = the dataset names joined by +.
name: public5
# Output: <output_dir>/<name>/plant[_min<size>mm], e.g. data/processed/public5/plant_min20mm,
# the data.dir of configs/detector.yaml.
output_dir: data/processed
