# OPPD, Open Plant Phenotyping Database (Madsen et al., 2020; Aarhus University): weed
# species as EPPO codes, top-down images of trays with a box per plant. Used by
# scripts/download_datasets.py (see configs/download.yaml) and scripts/convert_oppd.py.
# Relative paths are resolved against the project root. Licence: CC BY-NC-SA 4.0 (official
# page, and LICENSE.md in the download).

# Where the download is unpacked.
raw_dir: data/raw/oppd

download:
  # Dataset Ninja's copy "OPPD: Full Images" in Supervisely format: LICENSE.md, README.md,
  # meta.json (the classes), ds0/ann/<image>.json (the boxes) and ds0/img/. The link of the
  # download button on https://datasetninja.com/open-plant-phenotyping-database (checked
  # 2026-10-22): byte ranges work, ~2 MB/s from the university network + VPN, also with 12
  # connections, so about 6 hours. No checksum is published.
  #
  # Alternatives: the dataset-tools package's Dropbox link
  # (https://www.dropbox.com/scl/fi/3iro0ib5fvqqdibevrdh9/oppd-full-images-DatasetNinja.tar?rlkey=7cxvr3db9quqburng8wzl3buz&dl=1),
  # disabled for too much traffic on 2026-10-22; the original host,
  # gitlab.au.dk/AUENG-Vision/OPPD, down on 2026-10-21.
  #
  # An unfinished browser download of this link (even one the browser wrongly took as
  # complete) can be renamed to data/raw/oppd/.archives/oppd-full-images-DatasetNinja.tar.part
  # and is continued.
  files:
    - url: https://assets.supervisely.com/remote/eyJsaW5rIjogInMzOi8vc3VwZXJ2aXNlbHktZGF0YXNldHMvMzAxM19PUFBEOiBGdWxsIEltYWdlcy9vcHBkOi1mdWxsLWltYWdlcy1EYXRhc2V0TmluamEudGFyIiwgInNpZyI6ICJ5cmIreDE5bzErdVJkbDNCcG0zTmExeGtzUmdGTGVDVWpGd2lJLytML0V3PSJ9?response-content-disposition=attachment%3B%20filename%3D%22oppd%3A-full-images-DatasetNinja.tar%22
      # The server's name has a colon, which Windows doesn't allow.
      name: oppd-full-images-DatasetNinja.tar
      size: 44951091200
      extract: true
  # Keep the archive in <raw_dir>/.archives/ after unpacking it.
  keep_archives: false

# Conversion to COCO (scripts/convert_oppd.py). See docs/datasets/oppd.md. Boxes only: the
# images are marked box_only and reach the species classifier, not Mask R-CNN.
convert:
  output_dir: data/processed/oppd
  label_map: configs/label_maps/oppd.csv
  eppo_taxa: configs/eppo_taxa.csv
  # A label-map column; species = EPPO codes, for scripts/combine_datasets.py.
  taxonomy: species
  # Plants whose box is shorter than this on its longer side (mm, via mm_per_px_estimate)
  # become ignore regions. Must match the other datasets to combine them. Most OPPD boxes
  # are seedlings: about a third of them pass 20 mm.
  min_plant_size_mm: 20
  # Images without plants (or with only plants under min_plant_size_mm) are negative
  # samples. false drops them: box-only images reach only the species classifier, which
  # learns nothing from an image without plants.
  keep_negative_images: false
  # Split by tray (trial + box id), never by image: a tray is photographed on many days and
  # its images show the same plants. Balanced over species; each species grew in 3 trays
  # (a few in 6 or 9), so a species gets 1 or 2 trays for training.
  split:
    seed: 0
    fractions: {train: 0.70, val: 0.15, test: 0.15}
  # Ground resolution from the dataset page: 44 pixels/mm2, i.e. 6.63 px/mm.
  mm_per_px_estimate: 0.1508
