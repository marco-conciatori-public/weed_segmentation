# Convert every downloaded dataset in one go: which datasets
# scripts/data_prep/convert_datasets.py converts, in this order, and with which converter.
# Relative paths are resolved against the project root. Each dataset's own config holds its
# convert settings; the converters can still be run one by one.

# Dataset config: converter script. Every listed dataset is converted again on each run; one
# not downloaded yet (raw_dir missing, or only its archives) is skipped. Comment a line out
# to leave a dataset alone.
datasets:
  # The training datasets of configs/combine.yaml.
  configs/cropandweed.yaml: scripts/data_prep/convert_cropandweed.py
  configs/acre.yaml: scripts/data_prep/convert_acre.py
  configs/phenobench.yaml: scripts/data_prep/convert_phenobench.py
  configs/lincolnbeet.yaml: scripts/data_prep/convert_weedai.py
  configs/oppd.yaml: scripts/data_prep/convert_oppd.py
  configs/cornweed.yaml: scripts/data_prep/convert_cornweed.py
  configs/deepseedling.yaml: scripts/data_prep/convert_deepseedling.py
  # Test-only datasets (combine.yaml's test_only).
  configs/weedmaize.yaml: scripts/data_prep/convert_weedmaize.py
  configs/sugarbeets2016.yaml: scripts/data_prep/convert_sugarbeets2016.py
  # Converted, not combined at present.
  configs/groundbased_weed.yaml: scripts/data_prep/convert_groundbased_weed.py
  configs/vcd.yaml: scripts/data_prep/convert_weedai.py
  configs/imageweeds.yaml: scripts/data_prep/convert_weedai.py

# `convert` settings every dataset must share, checked before anything is converted:
# scripts/data_prep/combine_datasets.py needs one taxonomy and one size filter. [] = no check.
same_settings: [taxonomy, min_plant_size_mm]
