# PhenoBench (Weyler et al., 2024; University of Bonn): sugar beet and weeds from a UAV, with
# plant instance masks for crops and weeds. Used by scripts/download_datasets.py (see
# configs/download.yaml) and scripts/convert_phenobench.py. Relative paths are resolved
# against the project root.
# Licence: CC BY-NC-SA 4.0, per the README.MD of the download (v1.1.0); the website said
# CC BY-SA 4.0.

# Where the download is unpacked.
raw_dir: data/raw/phenobench

download:
  # Labelled train and val splits (the test labels are not public). Size and MD5 as given
  # on the dataset page (checked 2026-10-21).
  files:
    - url: https://www.phenobench.org/data/PhenoBench-v110.zip
      size: 7630658167
      md5: 5168bba762053725890478432cdbdb1d
      extract: true
  # Keep the archive in <raw_dir>/.archives/ after unpacking it.
  keep_archives: false

# Conversion to COCO (scripts/convert_phenobench.py). See docs/datasets/phenobench.md.
# PhenoBench's own split is kept, since it separates crop rows (4 rows for train, 2 for val):
# its train and val images are our train and val splits. Its test labels are not public, so
# it adds nothing to our test split.
convert:
  output_dir: data/processed/phenobench
  label_map: configs/label_maps/phenobench.csv
  eppo_taxa: configs/eppo_taxa.csv
  # A label-map column; species = EPPO codes, for scripts/combine_datasets.py.
  taxonomy: species
  # Plants whose box is shorter than this on its longer side (mm, via mm_per_px_estimate)
  # become ignore regions. Must match the other datasets to combine them.
  min_plant_size_mm: 20
  # Images without plants (or with only plants under min_plant_size_mm) are negative
  # samples. false drops them.
  keep_negative_images: true
  # Plants less than half visible (PhenoBench's partial crops and weeds: cut by the image
  # border or covered by a neighbour) become ignore regions. false keeps them as plants.
  ignore_partial_plants: true
  # Ground resolution, from the paper: GSD 1 mm/px, the drone flying at about 21 m.
  mm_per_px_estimate: 1.0
