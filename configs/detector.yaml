# Plant detector: torchvision Faster R-CNN ResNet-50 FPN v2 (BSD-3-Clause), one class (plant),
# boxes only. Used by scripts/train_detector.py, scripts/evaluate_detector.py and
# scripts/export_detector.py. Relative paths are resolved against the project root.
# See docs/detector.md.

# Outputs (checkpoints, TensorBoard logs, metrics, evaluations) go to <output_dir>/<run_name>/.
# Placeholders: {dataset} and {taxonomy} = the last two folders of data.dir (e.g. public7 and
# plant_min20mm). Add your own text to tell apart runs that change other settings, e.g.
# "{dataset}_{taxonomy}_lr0.01". A plain name works too.
run_name: "{dataset}_{taxonomy}"
output_dir: runs/detector
seed: 0
# auto = CUDA when available, else CPU (CPU is only good for a smoke test).
device: auto

data:
  # Folder with train.json, val.json and test.json (and test_<dataset>.json of the test-only
  # datasets): the output of scripts/combine_datasets.py (<output_dir>/<name>/
  # plant[_min<size>mm] of configs/combine.yaml).
  dir: data/processed/public7/plant_min20mm
  # Data-loading processes. 0 loads in the main process (slow, but simplest to debug).
  num_workers: 6
  # Use a random subset of N images (null = all). For a quick smoke test, e.g. 16 and 8.
  max_train_images: null
  max_val_images: null

augment:
  horizontal_flip: 0.5  # probability
  vertical_flip: 0.5
  color_jitter: {brightness: 0.2, contrast: 0.2, saturation: 0.2, hue: 0.02}

model:
  # Start from torchvision's COCO weights (~170 MB). false = random init.
  pretrained: true
  # File with those weights, for machines without internet access. Download it from
  # https://download.pytorch.org/models/fasterrcnn_resnet50_fpn_v2_coco-dd69338a.pth
  # null = torchvision downloads it once to the torch cache (~/.cache/torch/hub/checkpoints).
  pretrained_path: weights/fasterrcnn_resnet50_fpn_v2_coco-dd69338a.pth
  # Images are resized so the short side is min_size, long side at most max_size. With several
  # values, training picks one at random for each image (scale augmentation: plants shown at
  # other sizes, as photos at other scales show them; see configs/detector_scale.yaml); the
  # last one is used at evaluation and in the export. 1088/1920 keeps CropAndWeed at its native
  # resolution: 10% of its plants are under 22 px.
  min_size: [1088]
  max_size: 1920
  # Anchor size per FPN level (5 levels). torchvision's default is 32-512; one level smaller
  # suits the small plants (median box ~50 px, 1% over 512 px).
  anchor_sizes: [16, 32, 64, 128, 256]
  # CropAndWeed has up to ~300 annotated regions per image.
  detections_per_image: 300
  # Detections below this score are dropped (low, so AP sees the whole precision curve).
  score_threshold: 0.05

train:
  epochs: 24
  batch_size: 4
  # SGD; 0.005 is torchvision's reference 0.02 for 16 images, scaled to 4.
  lr: 0.005
  momentum: 0.9
  weight_decay: 0.0001
  warmup_steps: 500
  # Max gradient norm (null = no clipping).
  grad_clip: 10.0
  # Mixed precision (CUDA only): faster and about half the memory.
  amp: true
  # Evaluate on val every N epochs (and after the last one); the best box AP is kept (best.pt).
  eval_every: 2
  eval_batch_size: 2
  # Continue from <run>/last.pt when it exists. To start over, change run_name. Resuming refuses
  # a run whose model settings or data.dir differ.
  resume: true
  # Log the training losses to TensorBoard every N steps.
  log_every: 20
  # Also save last.pt every N training steps (null = only after each epoch), so a crash
  # (e.g. of the GPU driver) loses a few minutes rather than the epoch under way.
  checkpoint_every: 200

evaluate:
  # Checkpoint of this run: best, last, or a path to a .pt file.
  checkpoint: best
  # Which file of data.dir to evaluate: val, test, or a test-only dataset's test_<dataset>
  # (test_weedmaize: the unseen site; test_sugarbeets2016: imperfect labels, not a measure).
  # Keep test and the test-only files for the final numbers. export_detector.py's README
  # reports this split's numbers.
  split: val
  # Also evaluated, each in its own folder (e.g. the test-only datasets); [] = none. These
  # files must exist in data.dir (configs/combine.yaml's test_only).
  extra_splits: [test_weedmaize, test_sugarbeets2016]
  # Evaluate a random subset of N images (null = all). For a quick smoke test.
  max_images: null
  batch_size: 2
  # Plants found, per dataset and per species: a labelled plant counts as found when a
  # detection with at least this score overlaps its box with at least this IoU. AP is COCO's.
  score_threshold: 0.5
  iou_threshold: 0.5
  # EPPO taxonomy: the scientific names in by_species.csv.
  eppo_taxa: configs/eppo_taxa.csv
  # Images with ground truth and predictions side by side (0 = none).
  num_previews: 20
  preview_score_threshold: 0.5

# Scale test (scripts/evaluate_scale.py): the plants found when the images are shown at other
# scales than their own, as photos from other cameras and heights show them. Writes
# <run>/scale/<split>_<checkpoint>/report.md and report.csv. Uses evaluate.checkpoint,
# train.amp and device. See docs/detector.md (Scale).
evaluate_scale:
  split: val
  # Datasets of the split to show (their images' `dataset` field); null = all of them.
  datasets: null
  # Per dataset, images in a fixed random order (seed) until they hold this many labelled
  # plants, or are max_images_per_dataset (null = no limit, for both). Each image is shown 14
  # times (the views below); about 1 s per image on the RTX 4090 (estimate), ~70 s on a laptop
  # CPU.
  plants_per_dataset: 2000
  max_images_per_dataset: 150
  # Scales to show each image at, in mm per pixel at the detector (1 mm/px is about 1.09 m of
  # ground across the short side at min_size 1088). Each image is also shown at its own scale
  # (native). public7 at the detector: 0.35 (LincolnBeet, DeepSeedling) to 0.94 (PhenoBench).
  targets: [0.25, 0.35, 0.5, 0.7, 1.0, 1.4, 2.0, 2.8, 4.0]
  # Targets (coarser than native) also shown rescaled: shrunk to the target, then enlarged back
  # to the usual scale, as a known ground resolution allows. [] = none.
  rescaled: [1.4, 2.8]
  # Also show each image at its own scale resized by the detector's own transform (bilinear,
  # no anti-aliasing), as the exported model does, besides area averaging.
  deployed: true
  # A finer target enlarges a centred window (a close-up). Skipped where that would enlarge the
  # image's own pixels more than this: a real close-up is sharp, an enlarged image is blurred.
  max_upsample: 1.5
  # A plant is found by a detection with at least this score whose box overlaps its box at
  # this IoU (as the evaluate section).
  score_threshold: 0.5
  iou_threshold: 0.5
  # Plants found are also counted by real size (longest side, mm), cut at these edges.
  size_bands_mm: [40, 80]
  # CPU threads for torch and OpenCV (image resizing).
  threads: 4
