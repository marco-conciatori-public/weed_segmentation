# Plant detector of the two-stage pipeline: the Mask R-CNN of configs/maskrcnn.yaml, trained on
# the one-class (plant) copy of the species data. Used by scripts/train_detector.py and
# scripts/evaluate_detector.py. See docs/twostage.md.
#
# Only what differs from the base config is here; every other setting (model, training,
# evaluation) comes from it, so the detector and the species model are trained alike.
base: configs/maskrcnn.yaml

data:
  # Written by scripts/make_plant_dataset.py: a sibling of its source_dir.
  dir: data/processed/cropandweed+acre+phenobench+oppd/plant_min20mm
