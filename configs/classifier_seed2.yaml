# Classifier variant: configs/classifier_dinov2.yaml with a third seed and nothing else. With
# its run (seed 0) and classifier_seed1.yaml it gives three DINOv2 runs, to see how far results
# swing by chance, as classifier_dinov3_seed1/2.yaml do for DINOv3, so the two backbones are
# compared against their own spread (docs/twostage.md, Comparing runs). Trained after the base
# run by scripts/run_twostage.py (classifier_variants in configs/run_twostage.yaml).
# Result 2026-10-28 (last epoch): val accuracy 93.7%, as the base. Over the three DINOv2
# seeds chance moves overall and balanced accuracy by 0.3 point, OPPD's balanced by 1.7,
# and both stages' CropAndWeed harmful removed by 1.6.
base: configs/classifier_dinov2.yaml
run_name: "{dataset}_{taxonomy}_dinov2b_seed2"
seed: 2
