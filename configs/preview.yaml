# Annotation preview: draws boxes, labels and stems of a COCO file over its images. Used by
# scripts/preview_annotations.py. Relative paths are resolved against the project root.

# Any COCO file in our internal format (its info.image_dir says where the images are), e.g. a
# converted dataset or the combined data.
coco_json: data/processed/cropandweed/species_min20mm/train.json
# Images go to <output_dir>/<dataset>/<taxonomy>/<split>/, named after the COCO file's
# last two folders and its name (here cropandweed/species_min20mm/train).
output_dir: outputs/preview
num_images: 20
seed: 0
# Sample only images with at least one annotation (negatives show nothing to check).
only_annotated: true
# Also save the original image next to each preview, to compare by flipping between them.
save_original: false
draw:
  labels: true
  stems: true
