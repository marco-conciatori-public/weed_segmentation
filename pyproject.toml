[project]
name = "weed-segmentation"
version = "0.1.0"
description = "Plant detection (boxes, one class) for robotic precision weeding"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Deep learning
    # Pinned so every machine trains on the same version; 2.11 is the last with cu128 wheels.
    "torch==2.11.0",
    "torchvision==0.26.0",
    # Weights of the deployment package (weedseg.deploy), plain tensors without pickled code
    "safetensors",
    # Images and annotations
    "numpy",
    "pillow",
    "opencv-python-headless",
    "pycocotools",
    # Data handling and utilities
    "pyyaml",
    "tqdm",
    "requests",
    # Training logs
    "tensorboard",
]

# Building the package makes `uv sync` install `src/weedseg` in editable mode, so scripts can
# `import weedseg` whatever the working directory.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weedseg"]

[project.optional-dependencies]
# AGPL-3.0: fine for R&D baselines, needs a commercial licence for a shipped product.
yolo = ["ultralytics"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "jupyterlab",
    "ipywidgets",
]

[tool.uv]
default-groups = ["dev"]

# PyTorch CUDA builds, picked per machine by `uv sync`: cu130 on ARM Linux (DGX Spark, GB10
# Blackwell, CUDA 13 driver), cu128 on Windows and x86 Linux. macOS gets the PyPI build.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine != 'aarch64')" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine != 'aarch64')" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
